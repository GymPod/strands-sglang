name: Claude PR Action

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write


on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  claude-pr:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-west-2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure AWS credentials (static)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.BEDROCK_KEY }}
          aws-secret-access-key: ${{ secrets.BEDROCK_SECRET_KEY }}
          aws-region: us-west-2

      - name: Who am I
        run: aws sts get-caller-identity

      - uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: "autonomy-claude-code"
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          claude_args: '--model global.anthropic.claude-opus-4-6-v1 --max-turns 1000'
